project:
  type: book
  output-dir: docs

book:
  title: "Nested Data Structures"
  subtitle: "A Workshop on Multilevel Modeling · RSM"
  author: "Dan Schley"
  date: today
  repo-url: https://github.com/DanRSchley/Nested-Data-Workshop
  repo-actions: [issue]
  site-url: "https://danrschley.github.io/Nested-Data-Workshop"
  description: >
    A graduate-level open workshop on nested data analysis and multilevel modeling.
    Covers the mixed-effects framework, centering and within/between-person effects,
    causal identification (IV, RDD, DiD, propensity scores), longitudinal modeling,
    and nested experimental designs — each module with worked R simulations.
  open-graph:
    title: "Nested Data Structures — RSM Workshop"
    description: >
      Graduate open-access workshop: multilevel modeling, panel data, and causal
      identification (RDD, DiD, IV) with R simulations. Rotterdam School of
      Management, Erasmus University.
    image: "figs/og-preview.png"
  twitter-card:
    title: "Nested Data Structures"
    description: >
      Open graduate workshop: multilevel modeling, panel data, and causal inference with R.
    card-style: summary_large_image
    image: "figs/og-preview.png"
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - part: "Module 0: All Data is Nested"
      chapters:
        - module-0/intro.qmd
        - module-0/part1.qmd
        - module-0/part2.qmd
        - module-0/part3.qmd
        - module-0/part4.qmd
    - part: "Module 1: The Mixed-Effects Framework"
      chapters:
        - module-1/intro.qmd
        - module-1/part1.qmd
        - module-1/part2.qmd
        - module-1/part3.qmd
        - module-1/part4.qmd
        - module-1/part5.qmd
        - module-1/part6.qmd
    - part: "Module 2: Centering & Between/Within Effects"
      chapters:
        - module-2/intro.qmd
        - module-2/part1.qmd
        - module-2/part2.qmd
        - module-2/part3.qmd
    - part: "Module 3: Inferential Threats & Identification"
      chapters:
        - module-3/intro.qmd
        - module-3/part1.qmd
        - module-3/part2.qmd
        - module-3/part3.qmd
        - module-3/part4.qmd
        - module-3/part5.qmd
        - module-3/part6.qmd
    - part: "Module 4: Longitudinal Data & Change"
      chapters:
        - module-4/intro.qmd
        - module-4/part1.qmd
        - module-4/part2.qmd
        - module-4/part2b.qmd
        - module-4/part3.qmd
        - module-4/part4.qmd
        - module-4/part5.qmd
        - module-4/part6.qmd
        - module-4/part7.qmd
        - module-4/part8.qmd
        - module-4/part9.qmd
        - module-4/part10.qmd
    - part: "Module 5: Experimental Designs with Nesting"
      chapters:
        - module-5/intro.qmd
        - module-5/part1.qmd
        - module-5/part2.qmd
        - module-5/part3.qmd
        - module-5/part4.qmd
        - module-5/part5.qmd
        - module-5/part6.qmd
        - module-5/part7.qmd
        - module-5/part8-worked-example.qmd
  appendices:
    - about.qmd
    - suggest.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools:
      source: false
      toggle: true
      caption: "Show/Hide All Code"
    highlight-style: github
    df-print: kable

execute:
  warning: false
  message: false
  freeze: auto
